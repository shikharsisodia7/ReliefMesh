services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - reliefmesh_mongo:/data/db

  api:
    build: ./backend
    depends_on:
      - mongodb
    environment:
      RELIEFMESH_APP_ENV: development
      RELIEFMESH_STORAGE_MODE: mongo
      RELIEFMESH_MONGODB_URI: mongodb://mongodb:27017
      RELIEFMESH_MONGODB_DATABASE: reliefmesh
      RELIEFMESH_JWT_SECRET: local-development-secret-must-not-be-used-in-production
      RELIEFMESH_FRONTEND_ORIGIN: http://localhost:3000
      RELIEFMESH_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"

volumes:
  reliefmesh_mongo:
